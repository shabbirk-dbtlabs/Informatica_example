name: 'informatica_migration'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  informatica_migration:
    +persist_docs:
      relation: true
      columns: true
    raw:
      +materialized: view
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  informatica_migration:
    +schema: informatica_migration
    +quote_columns: false
    mock_informatica:
      +tags: ["mock_source"]
